<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="opti-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180b02"/>
      <stop offset="50%" stop-color="#2d1203"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <filter id="opti-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="opti-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(249,115,22,0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#opti-bg)"/>
  <rect width="1200" height="800" fill="url(#opti-grid)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="200" r="220" fill="#ea580c" opacity="0.25" filter="url(#opti-glow)"/>
  <circle cx="1000" cy="600" r="260" fill="#f59e0b" opacity="0.3" filter="url(#opti-glow)"/>

  <!-- Main Glass Dashboard Mockup -->
  <g transform="translate(100, 80)">
    <rect x="0" y="0" width="1000" height="640" rx="32" fill="rgba(33, 14, 3, 0.85)" stroke="rgba(249, 115, 22, 0.4)" stroke-width="2" filter="drop-shadow(0 20px 40px rgba(0,0,0,0.6))"/>
    
    <!-- Window Header Bar -->
    <rect x="0" y="0" width="1000" height="64" rx="32" fill="rgba(46, 19, 4, 0.95)"/>
    <circle cx="36" cy="32" r="7" fill="#ef4444"/>
    <circle cx="60" cy="32" r="7" fill="#f59e0b"/>
    <circle cx="84" cy="32" r="7" fill="#10b981"/>
    <text x="120" y="38" fill="#fed7aa" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="2">OPTIFLOW ERP // BPR WORKFLOW ENGINE &amp; VALUE STREAM</text>
    <rect x="820" y="18" width="140" height="28" rx="14" fill="rgba(249,115,22,0.2)" stroke="#f97316" stroke-width="1"/>
    <text x="845" y="36" fill="#fb923c" font-family="monospace" font-size="11" font-weight="bold">● LEAN ACTIVE</text>

    <!-- Left Stats Cards -->
    <g transform="translate(40, 95)">
      <rect x="0" y="0" width="280" height="150" rx="20" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(249, 115, 22, 0.25)" stroke-width="1.5"/>
      <text x="24" y="38" fill="#fdba74" font-family="sans-serif" font-size="13" font-weight="bold">PROCESSING COST CUT</text>
      <text x="24" y="85" fill="#ffffff" font-family="sans-serif" font-size="34" font-weight="900">-91.5%</text>
      <text x="24" y="122" fill="#34d399" font-family="monospace" font-size="12">▲ ₹28.5L ANNUAL SAVINGS</text>

      <rect x="0" y="170" width="280" height="150" rx="20" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(245, 158, 11, 0.25)" stroke-width="1.5"/>
      <text x="24" y="208" fill="#fcd34d" font-family="sans-serif" font-size="13" font-weight="bold">CYCLE EFFICIENCY (PCE)</text>
      <text x="24" y="255" fill="#ffffff" font-family="sans-serif" font-size="34" font-weight="900">83.3% PCE</text>
      <text x="24" y="292" fill="#fb923c" font-family="monospace" font-size="12">✔ 4.2 HRS VS 7.2 DAYS</text>
    </g>

    <!-- Right Kanban Mockup -->
    <g transform="translate(350, 95)">
      <rect x="0" y="0" width="610" height="490" rx="20" fill="rgba(24, 11, 2, 0.6)" stroke="rgba(249, 115, 22, 0.2)" stroke-width="1.5"/>
      <text x="30" y="45" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">4-Stage Kanban &amp; Neural OCR Engine</text>
      <text x="30" y="70" fill="#fed7aa" font-family="monospace" font-size="12">Jobaaj Consulting Workshop Standard • 8 Bottlenecks Eliminated</text>
      
      <!-- Kanban Pipeline Rows -->
      <g transform="translate(30, 100)">
        <rect x="0" y="0" width="550" height="45" rx="10" fill="rgba(249, 115, 22, 0.1)"/>
        <text x="20" y="28" fill="#fb923c" font-family="monospace" font-size="13" font-weight="bold">STAGE 01 // Ingestion: Optical Laser OCR Ingestion</text>
        <text x="440" y="28" fill="#34d399" font-family="monospace" font-size="13" font-weight="bold">99.2% OCR</text>

        <rect x="0" y="55" width="550" height="45" rx="10" fill="rgba(255, 255, 255, 0.02)"/>
        <text x="20" y="83" fill="#e2e8f0" font-family="monospace" font-size="13">STAGE 02 // 3-Way Match: PO vs Gate Pass vs Bill</text>
        <text x="440" y="83" fill="#fb923c" font-family="monospace" font-size="13" font-weight="bold">AUTO-PASS</text>

        <rect x="0" y="110" width="550" height="45" rx="10" fill="rgba(255, 255, 255, 0.02)"/>
        <text x="20" y="138" fill="#e2e8f0" font-family="monospace" font-size="13">STAGE 03 // Single-Point Authorization &amp; Settlement</text>
        <text x="440" y="138" fill="#10b981" font-family="monospace" font-size="13" font-weight="bold">SETTLED</text>
      </g>
    </g>
  </g>
</svg>
