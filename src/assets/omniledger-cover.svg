<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="omni-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02140d"/>
      <stop offset="50%" stop-color="#052418"/>
      <stop offset="100%" stop-color="#0b3d2b"/>
    </linearGradient>
    <linearGradient id="emerald-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="omni-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="omni-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(16,185,129,0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#omni-bg)"/>
  <rect width="1200" height="800" fill="url(#omni-grid)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="200" r="220" fill="#10b981" opacity="0.25" filter="url(#omni-glow)"/>
  <circle cx="1000" cy="600" r="260" fill="#0d9488" opacity="0.3" filter="url(#omni-glow)"/>

  <!-- Main Glass Dashboard Mockup -->
  <g transform="translate(100, 80)">
    <rect x="0" y="0" width="1000" height="640" rx="32" fill="rgba(4, 25, 17, 0.85)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="2" filter="drop-shadow(0 20px 40px rgba(0,0,0,0.6))"/>
    
    <!-- Window Header Bar -->
    <rect x="0" y="0" width="1000" height="64" rx="32" fill="rgba(5, 38, 27, 0.95)"/>
    <circle cx="36" cy="32" r="7" fill="#ef4444"/>
    <circle cx="60" cy="32" r="7" fill="#f59e0b"/>
    <circle cx="84" cy="32" r="7" fill="#10b981"/>
    <text x="120" y="38" fill="#a7f3d0" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="2">OMNILEDGER AI // GENERAL LEDGER &amp; 3-WAY RECONCILIATION</text>
    <rect x="820" y="18" width="140" height="28" rx="14" fill="rgba(16,185,129,0.2)" stroke="#10b981" stroke-width="1"/>
    <text x="845" y="36" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">● LIVE RECONCILED</text>

    <!-- Left Stats Cards -->
    <g transform="translate(40, 95)">
      <rect x="0" y="0" width="280" height="150" rx="20" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1.5"/>
      <text x="24" y="38" fill="#6ee7b7" font-family="sans-serif" font-size="13" font-weight="bold">TOTAL RECONCILED ASSETS</text>
      <text x="24" y="85" fill="#ffffff" font-family="sans-serif" font-size="34" font-weight="900">₹ 42.8M</text>
      <text x="24" y="122" fill="#34d399" font-family="monospace" font-size="12">▲ 100% BALANCED • 0% VARIANCE</text>

      <rect x="0" y="170" width="280" height="150" rx="20" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(13, 148, 136, 0.25)" stroke-width="1.5"/>
      <text x="24" y="208" fill="#5eead4" font-family="sans-serif" font-size="13" font-weight="bold">MONTH-END CLOSE SPEED</text>
      <text x="24" y="255" fill="#ffffff" font-family="sans-serif" font-size="34" font-weight="900">10x FASTER</text>
      <text x="24" y="292" fill="#2dd4bf" font-family="monospace" font-size="12">✔ AUTOMATED 3-WAY MATCHING</text>
    </g>

    <!-- Right Data Table Mockup -->
    <g transform="translate(350, 95)">
      <rect x="0" y="0" width="610" height="490" rx="20" fill="rgba(2, 20, 13, 0.6)" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1.5"/>
      <text x="30" y="45" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">Multi-Entity General Ledger Matrix</text>
      <text x="30" y="70" fill="#a7f3d0" font-family="monospace" font-size="12">MOS Master Standard: SUMIFS, INDEX-MATCH, Zero-Variance</text>
      
      <!-- Table Rows -->
      <g transform="translate(30, 100)">
        <rect x="0" y="0" width="550" height="45" rx="10" fill="rgba(16, 185, 129, 0.1)"/>
        <text x="20" y="28" fill="#34d399" font-family="monospace" font-size="13" font-weight="bold">TXN-8801 // Ashte Logistics CFS</text>
        <text x="380" y="28" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">₹ 14,200 (MATCH)</text>

        <rect x="0" y="55" width="550" height="45" rx="10" fill="rgba(255, 255, 255, 0.02)"/>
        <text x="20" y="83" fill="#e2e8f0" font-family="monospace" font-size="13">TXN-8802 // Shilpa Medical Supplies</text>
        <text x="380" y="83" fill="#34d399" font-family="monospace" font-size="13" font-weight="bold">₹ 48,000 (MATCH)</text>

        <rect x="0" y="110" width="550" height="45" rx="10" fill="rgba(255, 255, 255, 0.02)"/>
        <text x="20" y="138" fill="#e2e8f0" font-family="monospace" font-size="13">TXN-8803 // Maersk Terminal Dwell</text>
        <text x="380" y="138" fill="#34d399" font-family="monospace" font-size="13" font-weight="bold">₹ 128,500 (MATCH)</text>
      </g>
    </g>
  </g>
</svg>
