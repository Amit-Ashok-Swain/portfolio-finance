<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="fin-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d24"/>
      <stop offset="50%" stop-color="#0f1738"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="fin-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="fin-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(99,102,241,0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#fin-bg)"/>
  <rect width="1200" height="800" fill="url(#fin-grid)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="200" r="220" fill="#6366f1" opacity="0.25" filter="url(#fin-glow)"/>
  <circle cx="1000" cy="600" r="260" fill="#14b8a6" opacity="0.3" filter="url(#fin-glow)"/>

  <!-- Main Glass Dashboard Mockup -->
  <g transform="translate(100, 80)">
    <rect x="0" y="0" width="1000" height="640" rx="32" fill="rgba(11, 18, 48, 0.85)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="2" filter="drop-shadow(0 20px 40px rgba(0,0,0,0.6))"/>
    
    <!-- Window Header Bar -->
    <rect x="0" y="0" width="1000" height="64" rx="32" fill="rgba(16, 27, 66, 0.95)"/>
    <circle cx="36" cy="32" r="7" fill="#ef4444"/>
    <circle cx="60" cy="32" r="7" fill="#f59e0b"/>
    <circle cx="84" cy="32" r="7" fill="#10b981"/>
    <text x="120" y="38" fill="#c7d2fe" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="2">FINTRACK PRO // PRODUCT REQUIREMENTS &amp; 3-CLICK EXPENSES</text>
    <rect x="820" y="18" width="140" height="28" rx="14" fill="rgba(20,184,166,0.2)" stroke="#14b8a6" stroke-width="1"/>
    <text x="845" y="36" fill="#2dd4bf" font-family="monospace" font-size="11" font-weight="bold">● PRD READY</text>

    <!-- Left Stats Cards -->
    <g transform="translate(40, 95)">
      <rect x="0" y="0" width="280" height="150" rx="20" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1.5"/>
      <text x="24" y="38" fill="#a5b4fc" font-family="sans-serif" font-size="13" font-weight="bold">REIMBURSEMENT SPEED</text>
      <text x="24" y="85" fill="#ffffff" font-family="sans-serif" font-size="34" font-weight="900">14.2 MINS</text>
      <text x="24" y="122" fill="#34d399" font-family="monospace" font-size="12">▲ -99.8% FASTER (VS 10 DAYS)</text>

      <rect x="0" y="170" width="280" height="150" rx="20" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(20, 184, 166, 0.25)" stroke-width="1.5"/>
      <text x="24" y="208" fill="#5eead4" font-family="sans-serif" font-size="13" font-weight="bold">GST TAX COMPLIANCE</text>
      <text x="24" y="255" fill="#ffffff" font-family="sans-serif" font-size="34" font-weight="900">99.4% ITC</text>
      <text x="24" y="292" fill="#2dd4bf" font-family="monospace" font-size="12">✔ ZERO POLICY VARIANCE</text>
    </g>

    <!-- Right PRD & Ledger Mockup -->
    <g transform="translate(350, 95)">
      <rect x="0" y="0" width="610" height="490" rx="20" fill="rgba(8, 13, 36, 0.6)" stroke="rgba(99, 102, 241, 0.2)" stroke-width="1.5"/>
      <text x="30" y="45" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">User Personas, Empathy &amp; MoSCoW Suite</text>
      <text x="30" y="70" fill="#c7d2fe" font-family="monospace" font-size="12">Jobaaj PM Workshop Standard • 3-Click Approval Gateway</text>
      
      <!-- Feature Rows -->
      <g transform="translate(30, 100)">
        <rect x="0" y="0" width="550" height="45" rx="10" fill="rgba(99, 102, 241, 0.1)"/>
        <text x="20" y="28" fill="#a5b4fc" font-family="monospace" font-size="13" font-weight="bold">MUST HAVE // Neural OCR Optical Receipt Extractor</text>
        <text x="440" y="28" fill="#34d399" font-family="monospace" font-size="13" font-weight="bold">P0 MVP</text>

        <rect x="0" y="55" width="550" height="45" rx="10" fill="rgba(255, 255, 255, 0.02)"/>
        <text x="20" y="83" fill="#e2e8f0" font-family="monospace" font-size="13">SHOULD HAVE // OpEx Department Budget Guardrails</text>
        <text x="440" y="83" fill="#a5b4fc" font-family="monospace" font-size="13" font-weight="bold">P1 Q4</text>

        <rect x="0" y="110" width="550" height="45" rx="10" fill="rgba(255, 255, 255, 0.02)"/>
        <text x="20" y="138" fill="#e2e8f0" font-family="monospace" font-size="13">COULD HAVE // WhatsApp Mobile Receipt Ingestion Bot</text>
        <text x="440" y="138" fill="#2dd4bf" font-family="monospace" font-size="13" font-weight="bold">P2 SPRINT</text>
      </g>
    </g>
  </g>
</svg>
