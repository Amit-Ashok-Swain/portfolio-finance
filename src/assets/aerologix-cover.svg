<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="aero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#031326"/>
      <stop offset="50%" stop-color="#072b4f"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <filter id="aero-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="aero-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56,189,248,0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#aero-bg)"/>
  <rect width="1200" height="800" fill="url(#aero-grid)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="200" r="220" fill="#0284c7" opacity="0.25" filter="url(#aero-glow)"/>
  <circle cx="1000" cy="600" r="260" fill="#38bdf8" opacity="0.3" filter="url(#aero-glow)"/>

  <!-- Main Glass Dashboard Mockup -->
  <g transform="translate(100, 80)">
    <rect x="0" y="0" width="1000" height="640" rx="32" fill="rgba(4, 28, 54, 0.85)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2" filter="drop-shadow(0 20px 40px rgba(0,0,0,0.6))"/>
    
    <!-- Window Header Bar -->
    <rect x="0" y="0" width="1000" height="64" rx="32" fill="rgba(6, 40, 77, 0.95)"/>
    <circle cx="36" cy="32" r="7" fill="#ef4444"/>
    <circle cx="60" cy="32" r="7" fill="#f59e0b"/>
    <circle cx="84" cy="32" r="7" fill="#10b981"/>
    <text x="120" y="38" fill="#bae6fd" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="2">AEROLOGIX CFS // 4,000+ TEU YARD TELEMETRY</text>
    <rect x="820" y="18" width="140" height="28" rx="14" fill="rgba(56,189,248,0.2)" stroke="#38bdf8" stroke-width="1"/>
    <text x="845" y="36" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">● CFS ACTIVE</text>

    <!-- Left Stats Cards -->
    <g transform="translate(40, 95)">
      <rect x="0" y="0" width="280" height="150" rx="20" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5"/>
      <text x="24" y="38" fill="#7dd3fc" font-family="sans-serif" font-size="13" font-weight="bold">CFS FACILITY SCALE</text>
      <text x="24" y="85" fill="#ffffff" font-family="sans-serif" font-size="34" font-weight="900">90k SQ. M</text>
      <text x="24" y="122" fill="#38bdf8" font-family="monospace" font-size="12">▲ 4,000+ CONTAINER CAPACITY</text>

      <rect x="0" y="170" width="280" height="150" rx="20" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(2, 132, 199, 0.25)" stroke-width="1.5"/>
      <text x="24" y="208" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">DWELL LATENCY REDUCTION</text>
      <text x="24" y="255" fill="#ffffff" font-family="sans-serif" font-size="34" font-weight="900">-38% LOWER</text>
      <text x="24" y="292" fill="#10b981" font-family="monospace" font-size="12">✔ 99.4% SLA COMPLIANCE</text>
    </g>

    <!-- Right Heatmap Mockup -->
    <g transform="translate(350, 95)">
      <rect x="0" y="0" width="610" height="490" rx="20" fill="rgba(3, 19, 38, 0.6)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5"/>
      <text x="30" y="45" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">Digital Twin Yard Grid &amp; Demurrage Engine</text>
      <text x="30" y="70" fill="#bae6fd" font-family="monospace" font-size="12">Ashte Logistics CFS Operations • ANSI SQL Telemetry Sandbox</text>
      
      <!-- Staging Bay Rows -->
      <g transform="translate(30, 100)">
        <rect x="0" y="0" width="550" height="45" rx="10" fill="rgba(56, 189, 248, 0.1)"/>
        <text x="20" y="28" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold">BAY-A1 // MSKU-908124 (40ft Dry) // Dwell: 3d</text>
        <text x="420" y="28" fill="#10b981" font-family="monospace" font-size="13" font-weight="bold">FREE PERIOD</text>

        <rect x="0" y="55" width="550" height="45" rx="10" fill="rgba(255, 255, 255, 0.02)"/>
        <text x="20" y="83" fill="#e2e8f0" font-family="monospace" font-size="13">BAY-R1 // CMAU-441209 (Reefer -18°C 415V)</text>
        <text x="420" y="83" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold">POWERED</text>

        <rect x="0" y="110" width="550" height="45" rx="10" fill="rgba(255, 255, 255, 0.02)"/>
        <text x="20" y="138" fill="#e2e8f0" font-family="monospace" font-size="13">BAY-H1 // HAZM-330129 (IMO Class 3 Staged)</text>
        <text x="420" y="138" fill="#f59e0b" font-family="monospace" font-size="13" font-weight="bold">ISOLATED</text>
      </g>
    </g>
  </g>
</svg>
